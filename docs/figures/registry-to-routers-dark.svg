<text x="36" y="194" class="tq" font-size="14">write</text>
<text x="108" y="194" class="t mono" font-size="14">a1b2c3d4…/**</text>
<text x="36" y="215" class="tq" font-size="14">read</text>
<text x="108" y="215" class="t mono" font-size="14">release/goat/**</text>
